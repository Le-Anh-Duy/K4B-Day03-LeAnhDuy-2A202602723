<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReAct Agent — Trợ lý Thư viện VinUni</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #f1f3f7;
    --border: #dfe3ea;
    --text: #1b2130;
    --muted: #6a7285;
    --accent: #2563eb;
    --green: #0f8a5f;
    --amber: #b45309;
    --red: #c2352f;
    --purple: #6d28d9;

    --code-bg: #f8f9fc;
    --hover: #eceff4;
    --scroll-thumb: #c8cdd8;
    --user-bubble: #e7effd;
    --user-border: #c4d8f8;
    --on-accent: #ffffff;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body, #root { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 "Segoe UI", system-ui, -apple-system, "Noto Sans", sans-serif;
  }

  button { font: inherit; color: inherit; cursor: pointer; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------------------------------------------------------------- layout */

  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100%;
  }

  .body-grid {
    display: grid;
    grid-template-columns: var(--left, 260px) minmax(0, 1fr) var(--right, 380px);
    min-height: 0;
  }

  /* ---------------------------------------------------------------- header */

  header.top {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .brand .logo { font-size: 20px; }
  .brand small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }

  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .badge b { color: var(--text); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .dot.off { background: var(--muted); }

  .toggles { display: flex; gap: 6px; }
  .toggles button {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; color: var(--muted);
  }
  .toggles button.on { color: var(--text); border-color: var(--accent); }
  .toggles button:hover { background: var(--hover); }

  /* --------------------------------------------------------------- sidebar */

  aside.left, aside.right {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  aside.right { border-right: none; border-left: 1px solid var(--border); }
  aside.hidden { display: none; }

  .pane-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  .pane-head .spacer { margin-left: auto; }

  .btn-new {
    width: calc(100% - 24px); margin: 12px;
    padding: 8px; border-radius: 8px;
    background: var(--accent); border: none; color: var(--on-accent); font-weight: 600;
  }
  .btn-new:hover { filter: brightness(1.1); }

  .session-list { overflow-y: auto; flex: 1; padding: 0 8px 12px; }

  .session {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; margin-bottom: 4px;
    border-radius: 8px; border: 1px solid transparent;
    cursor: pointer; font-size: 13px;
  }
  .session:hover { background: var(--panel-2); }
  .session.active { background: var(--panel-2); border-color: var(--accent); }
  .session .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .meta { font-size: 11px; color: var(--muted); }
  .session .del {
    background: none; border: none; color: var(--muted); padding: 2px 4px;
    opacity: 0; border-radius: 4px;
  }
  .session:hover .del { opacity: 1; }
  .session .del:hover { color: var(--red); background: #fdeaea; }

  /* ------------------------------------------------------------------ chat */

  main.chat { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }

  .messages { flex: 1; overflow-y: auto; padding: 22px 26px 8px; }

  .msg { max-width: 860px; margin: 0 auto 18px; display: flex; gap: 12px; }
  .msg .avatar {
    width: 30px; height: 30px; flex: none; border-radius: 8px;
    display: grid; place-items: center; font-size: 15px;
    background: var(--panel-2); border: 1px solid var(--border);
  }
  .msg .content { min-width: 0; flex: 1; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 11px 14px; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); border-color: var(--user-border); }

  .empty {
    max-width: 720px; margin: 8vh auto; text-align: center; color: var(--muted);
  }
  .empty h2 { color: var(--text); margin-bottom: 6px; font-size: 20px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
  .chip {
    text-align: left; max-width: 330px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: var(--text);
  }
  .chip:hover { border-color: var(--accent); }
  .chip .tag { display: block; font-size: 11px; color: var(--accent); margin-bottom: 3px; }

  /* ------------------------------------------------------------ disclosure */

  .disclosure { margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .disclosure > summary {
    list-style: none; cursor: pointer; padding: 7px 11px;
    background: var(--panel-2); font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .disclosure > summary::-webkit-details-marker { display: none; }
  .disclosure > summary::before { content: "▸"; font-size: 10px; }
  .disclosure[open] > summary::before { content: "▾"; }
  .disclosure > summary:hover { color: var(--text); }
  .disclosure .inner { padding: 10px 11px; background: var(--panel); }

  /* ----------------------------------------------------------------- trace */

  .step { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--panel); }
  .step-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  .step-body { padding: 9px 10px; display: grid; gap: 8px; }

  .pill {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
  }
  .pill.tool   { color: var(--accent); border-color: #bcd0f7; background: #eff4fe; }
  .pill.final  { color: var(--green);  border-color: #aadcc5; background: #edfaf4; }
  .pill.error  { color: var(--red);    border-color: #f0bcba; background: #fdeeed; }
  .pill.warn   { color: var(--amber);  border-color: #ecd2a4; background: #fdf6ea; }
  .pill.step   { color: var(--purple); border-color: #d3c4f5; background: #f5f1fe; }
  .pill.lat    { margin-left: auto; }

  .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .field-label.thought { color: var(--purple); }
  .field-label.action  { color: var(--accent); }
  .field-label.obs     { color: var(--green); }

  pre.code {
    margin: 4px 0 0; padding: 8px 10px; background: var(--code-bg);
    border: 1px solid var(--border); border-radius: 6px;
    font: 12px/1.5 "Cascadia Code", Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; overflow-x: auto; max-height: 320px;
  }

  .bar-track { height: 5px; background: var(--hover); border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); }

  /* ------------------------------------------------------------------ logs */

  .logs {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font: 12px/1.6 "Cascadia Code", Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; overflow-y: auto;
  }
  .logs .l-thought { color: var(--purple); }
  .logs .l-action  { color: var(--accent); }
  .logs .l-obs     { color: var(--green); }
  .logs .l-final   { color: var(--green); font-weight: 600; }
  .logs .l-warn    { color: var(--amber); }
  .logs .l-loop    { color: var(--muted); }

  /* -------------------------------------------------------------- composer */

  .composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 26px 16px; }
  .composer-inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px;
    font: inherit; outline: none;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer button.send {
    background: var(--accent); border: none; color: var(--on-accent); font-weight: 600;
    border-radius: 10px; padding: 12px 18px;
  }
  .composer button.send:disabled { background: var(--hover); color: var(--muted); cursor: not-allowed; }
  .hint { max-width: 860px; margin: 8px auto 0; font-size: 11px; color: var(--muted); }

  /* --------------------------------------------------------------- tabs */

  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tabs button {
    flex: 1; background: none; border: none; padding: 10px 4px;
    font-size: 12px; color: var(--muted); border-bottom: 2px solid transparent;
  }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button:hover { background: var(--panel-2); }

  .pane-scroll { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }

  .tool-card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--panel-2); }
  .tool-card > summary {
    list-style: none; cursor: pointer; padding: 9px 11px;
    display: flex; align-items: center; gap: 8px; font-size: 13px;
  }
  .tool-card > summary::-webkit-details-marker { display: none; }
  .tool-card .name { font-family: "Cascadia Code", Consolas, monospace; color: var(--accent); }
  .tool-card .count { margin-left: auto; font-size: 11px; color: var(--muted); }
  .tool-card .desc { padding: 0 11px 10px; font-size: 12.5px; color: var(--muted); }
  .tool-card .params { padding: 0 11px 11px; }

  .param { border-top: 1px dashed var(--border); padding: 7px 0; font-size: 12.5px; }
  .param .pname { font-family: "Cascadia Code", Consolas, monospace; color: var(--text); }
  .param .ptype { font-size: 11px; color: var(--amber); margin-left: 6px; }
  .param .preq  { font-size: 11px; color: var(--red); margin-left: 6px; }
  .param .pdesc { color: var(--muted); margin-top: 2px; }

  .muted-note { color: var(--muted); font-size: 12.5px; text-align: center; padding: 24px 10px; }

  .spinner {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--hover); border-top-color: var(--accent);
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ------------------------------------------------------------ responsive */

  @media (max-width: 1100px) {
    .body-grid { grid-template-columns: minmax(0, 1fr); }
    aside.left, aside.right { display: none; }
    aside.left.float, aside.right.float {
      display: flex; position: fixed; top: 52px; bottom: 0; width: min(88vw, 380px); z-index: 20;
      box-shadow: 0 8px 32px rgba(16, 24, 40, .18);
    }
    aside.left.float { left: 0; }
    aside.right.float { right: 0; }
    .messages, .composer { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="vendor/react.min.js"></script>
  <script src="vendor/react-dom.min.js"></script>
  <script src="vendor/htm.js"></script>
  <script src="app.js"></script>
</body>
</html>
